      The whole client is three HTTP calls:
        1. POST /runs          -> get a run_id back immediately
        2. GET  /runs/{id}     -> every 1.5s, until status is done or error
        3. render steps[]      -> that's the "Agent is thinking..." UI

      They live in src/api.ts, and they're identical in Vue, Svelte or Flutter.
      What changes between frameworks is src/useRun.ts — the cleanup.
