# Render Blueprint — https://render.com/docs/blueprint-spec
#
# You can create the service by hand in the dashboard instead; this file just
# means the settings are in version control rather than in someone's memory.
#
# In the dashboard: New + -> Blueprint -> pick this repo.

services:
  - type: web
    name: research-agent
    runtime: python
    plan: free
    region: singapore # pick the region closest to your users

    # The uv project (pyproject.toml, uv.lock, the app code itself) lives in
    # app/, not the repo root. rootDir makes every path below — including
    # buildCommand and startCommand — resolve relative to it.
    rootDir: app

    # Render's Python image doesn't ship uv, so install it first.
    # `--frozen` means "use uv.lock exactly, don't re-resolve" — your deploy
    # gets the versions you tested, not whatever is newest today.
    buildCommand: pip install uv && uv sync --frozen

    # `fastapi run` binds 0.0.0.0 by default — binding to localhost (127.0.0.1)
    # inside a container instead means nothing outside can reach you, which
    # shows up as a maddening "port scan timeout" in the deploy logs. It also
    # reads the PORT env var automatically, but we pass --port explicitly so
    # the command is self-explanatory without reading Render's docs.
    startCommand: uv run fastapi run main.py --port $PORT

    healthCheckPath: /health

    envVars:
      # sync: false  =>  "ask me for this value in the dashboard, and never
      # store it in the repo". This is how secrets stay out of git.
      - key: LLM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      # The `sb_secret_...` key. On an older project that only has the legacy
      # keys, SUPABASE_SERVICE_ROLE_KEY still works instead.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional. Leave it empty in the dashboard and the agent researches with
      # Wikipedia alone; fill it in and it can also search the live web, which
      # is the difference between answering "how do solar panels work" and
      # "what was announced this week". /health reports which you've got.
      - key: TAVILY_API_KEY
        sync: false

      # Not secret — safe to keep in the file.
      #
      # `gemini-flash-latest` is an alias Google keeps pointed at the current
      # free Flash model, so this doesn't 404 when a model name is retired.
      - key: LLM_MODEL
        value: gemini-flash-latest

      # Which provider serves that model: google | cerebras | openrouter |
      # openai-compatible. If a free key rate-limits you mid-workshop, change
      # these three values in the dashboard and redeploy — no code change.
      # /health reports the provider back so you can confirm the switch took.
      - key: LLM_PROVIDER
        value: google
      - key: MAX_AGENT_STEPS
        value: "12"
      # The other ceiling: how many questions one conversation may hold. Every
      # turn re-sends the whole history, so threads can't grow forever.
      - key: MAX_THREAD_TURNS
        value: "10"
      # Replace with your real GitHub Pages origin before you go public.
      - key: ALLOWED_ORIGINS
        value: "*"
